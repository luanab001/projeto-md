<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="brand">Sistema de Cadastro</div>
            <div class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="clientes.html">Clientes</a>
                <a href="fornecedores.html">Fornecedores</a>
                <a href="produtos.html">Produtos</a>
                <a href="vendas.html">Vendas</a>
                <a href="estoque.html">Estoque</a>
            </div>
            <div id="userRole" class="user-role">Acesso: Público</div>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>Cadastro de fornecedores</h2>
            <button class="btn btn-primary" onclick="window.location.href='index.html'">Voltar ao dashboard</button>
        </div>

        <div class="layout">
            <section class="panel form-panel">
                <h3>Adicionar fornecedor</h3>
                <form id="cadastroFornecedorForm" class="form-grid">
                    <div>
                        <label for="nome">Nome</label>
                        <input id="nome" name="nome" type="text" required>
                    </div>
                    <div>
                        <label for="contato">Contato</label>
                        <input id="contato" name="contato" type="text" required>
                    </div>
                    <div>
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" required>
                    </div>
                    <div>
                        <label for="telefone">Telefone</label>
                        <input id="telefone" name="telefone" type="tel" required>
                    </div>
                    <div>
                        <label for="cnpj">CNPJ</label>
                        <input id="cnpj" name="cnpj" type="text" required>
                    </div>
                    <div>
                        <label for="cidade">Cidade</label>
                        <input id="cidade" name="cidade" type="text" required>
                    </div>
                    <div>
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" type="submit">Salvar fornecedor</button>
                </form>
            </section>

            <section class="panel table-panel">
                <h3>Lista de fornecedores</h3>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Contato</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Cidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="fornecedoresTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
